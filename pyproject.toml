[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evedesign_server"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Thomas Hopf", email = "thomas.hopf@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["pydantic", "pydantic-settings", "loguru"]

[project.optional-dependencies]
api = [
  "fastapi[standard]", "uvicorn[standard]", "cryptography", "pyjwt[crypto]", "supabase",
  "sqlalchemy[asyncio]", "asyncpg", "psycopg[binary,pool]", "boto3", "aioboto3",
  "click",
]
pipeline = ["dill", "evedesign", "requests"]

[project.urls]
Documentation = "https://github.com/evedesignbio/evedesign-server#readme"
Issues = "https://github.com/evedesignbio/evedesign-server/issues"
Source = "https://github.com/evedesignbio/evedesign-server"

[tool.hatch.version]
path = "src/evedesign_server/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/evedesign_server tests}"

[tool.coverage.run]
source_pkgs = ["evedesign_server", "tests"]
branch = true
parallel = true
omit = [
  "src/evedesign_server/__about__.py",
]

[tool.coverage.paths]
evedesign_server = ["src/evedesign_server", "*/designserver-api/src/evedesign_server"]
tests = ["tests", "*/designserver-api/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
